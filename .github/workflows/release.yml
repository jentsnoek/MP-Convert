name: Build Windows release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: 1.0.2
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:windows
      - name: Publish release
        shell: pwsh
        run: |
          $asset = "dist/AudioWerk-$env:VERSION-portable.exe"
          gh release create "v$env:VERSION" $asset --repo $env:GITHUB_REPOSITORY --title "AudioWerk $env:VERSION" --notes "Portable Windows x64 app for local audio and video conversion to M4A."
