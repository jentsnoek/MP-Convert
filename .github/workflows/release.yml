name: Build Windows release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: 1.0.3
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:windows
      - name: Put the executable in a zip
        shell: pwsh
        run: |
          $asset = "dist/AudioWerk-$env:VERSION-portable.exe"
          $zip = "dist/AudioWerk-$env:VERSION-with-exe.zip"
          Compress-Archive -LiteralPath $asset -DestinationPath $zip -CompressionLevel Optimal
      - name: Publish release
        shell: pwsh
        run: |
          $asset = "dist/AudioWerk-$env:VERSION-portable.exe"
          $zip = "dist/AudioWerk-$env:VERSION-with-exe.zip"
          gh release create "v$env:VERSION" $asset $zip --repo $env:GITHUB_REPOSITORY --title "MP-Convert $env:VERSION" --notes "Windows x64 app with local file conversion, direct HTTPS media imports, and audio equalizer. The zip contains the portable executable."
